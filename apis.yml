aid: synergysuite
name: SynergySuite
description: >-
  SynergySuite is a back-of-house restaurant management platform for multi-unit
  and enterprise restaurant operators, founded in 2011 and operating across the
  United States, United Kingdom and Ireland. The suite covers inventory and
  purchasing, recipe and food costing, food safety and HACCP checklists, labor
  scheduling, cash management, human resources and business intelligence,
  delivered through a web interface and mobile applications. Its operational
  value depends on integration: SynergySuite ingests sales and order data from
  point-of-sale platforms including Toast, PAR Brink, NCR Aloha, Appetize by
  SpotOn and Oracle MICROS Simphony, and exchanges data with accounting,
  payroll, supplier and HR systems over POS integrations, EDI and data
  services. That integration surface is operated as a first-class product —
  it is monitored as named components on the company status page — but the
  API contract and reference are distributed through a partner portal that
  requires a login rather than a public developer site.
